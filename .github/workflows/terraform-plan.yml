name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_owner_email: ${{ secrets.TF_OWNER_EMAIL }}
      TF_IMPORT_D1_DATABASE_ID: ${{ secrets.TF_IMPORT_D1_DATABASE_ID }}
      TF_IMPORT_DNS_RECORD_ID: ${{ secrets.TF_IMPORT_DNS_RECORD_ID }}
      TF_IMPORT_ACCESS_APPLICATION_ID: ${{ secrets.TF_IMPORT_ACCESS_APPLICATION_ID }}
      TF_IMPORT_ACCESS_POLICY_ID: ${{ secrets.TF_IMPORT_ACCESS_POLICY_ID }}

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Import existing Cloudflare resources
        run: |
          missing=0
          for name in TF_IMPORT_D1_DATABASE_ID TF_IMPORT_DNS_RECORD_ID TF_IMPORT_ACCESS_APPLICATION_ID TF_IMPORT_ACCESS_POLICY_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required so terraform plan compares against existing Cloudflare resources."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          terraform import -input=false cloudflare_d1_database.tilelog_lens "${TF_VAR_cloudflare_account_id}/${TF_IMPORT_D1_DATABASE_ID}"
          terraform import -input=false cloudflare_record.tilelog_lens "${TF_VAR_cloudflare_zone_id}/${TF_IMPORT_DNS_RECORD_ID}"
          terraform import -input=false cloudflare_zero_trust_access_application.tilelog_lens "${TF_VAR_cloudflare_zone_id}/${TF_IMPORT_ACCESS_APPLICATION_ID}"
          terraform import -input=false cloudflare_zero_trust_access_policy.owner "${TF_VAR_cloudflare_zone_id}/${TF_IMPORT_ACCESS_POLICY_ID}"

      - name: Terraform plan
        run: terraform plan -input=false
